include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Berkas hasil build_runner — tidak pernah ditulis tangan, tidak perlu dianalisis.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"
    - "**/*.drift.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Naikkan dari INFO menjadi ERROR. Ketiganya menjaga kontrak dokumen 09,
    # jadi tidak boleh lolos hanya karena "cuma peringatan".
    # (Lint-nya sendiri diaktifkan di blok `linter` di bawah — menyebutkannya
    #  di sini hanya mengubah severity, tidak mengaktifkannya.)
    always_use_package_imports: error # impor relatif menembus batas lapisan tanpa terdeteksi
    unawaited_futures: error # sync fire-and-forget WAJIB eksplisit `unawaited(...)`
    close_sinks: error # StreamController printer & sync wajib ditutup

linter:
  rules:
    # ── Kebersihan dasar ────────────────────────────────────────────────────
    - always_declare_return_types
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unnecessary_lambdas
    - use_super_parameters

    # ── Penegak kontrak dokumen 09 ──────────────────────────────────────────
    # Batas lapisan hanya dapat ditegakkan import_lint bila impor memakai
    # `package:` — impor relatif tidak terlihat olehnya ([09 §2.2]).
    - always_use_package_imports

    # Sync dipicu fire-and-forget di beberapa tempat ([09 §7.3]); menuliskannya
    # tanpa `unawaited()` menyembunyikan Future yang gagal secara diam-diam.
    - unawaited_futures

    # PrinterManager & SyncEngine memegang StreamController jangka panjang.
    - close_sinks

    # `dynamic` menghapus seluruh manfaat tipe pada payload amplop API.
    - avoid_dynamic_calls

    # Token warna & spacing wajib const — tidak ada alokasi per-frame di grid produk.
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables

    # `print` tidak pernah masuk build release — pakai logging interceptor.
    - avoid_print

import_lint:
  severity: error
  rules:
    domain_no_flutter:
      target: "package:posgodinov_mobile/features/*/domain/**"
      from: "package:flutter/**"
      except: []
    domain_no_drift:
      target: "package:posgodinov_mobile/features/*/domain/**"
      from: "package:drift/**"
      except: []
    domain_no_dio:
      target: "package:posgodinov_mobile/features/*/domain/**"
      from: "package:dio/**"
      except: []
    domain_no_flutter_bloc:
      target: "package:posgodinov_mobile/features/*/domain/**"
      from: "package:flutter_bloc/**"
      except: []
    domain_no_data:
      target: "package:posgodinov_mobile/features/*/domain/**"
      from: "package:posgodinov_mobile/features/*/data/**"
      except: []
    domain_no_presentation:
      target: "package:posgodinov_mobile/features/*/domain/**"
      from: "package:posgodinov_mobile/features/*/presentation/**"
      except: []
    core_config_no_features:
      target: "package:posgodinov_mobile/core/config/**"
      from: "package:posgodinov_mobile/features/**"
      except: []
    core_crypto_no_features:
      target: "package:posgodinov_mobile/core/crypto/**"
      from: "package:posgodinov_mobile/features/**"
      except: []
    core_database_no_features:
      target: "package:posgodinov_mobile/core/database/**"
      from: "package:posgodinov_mobile/features/**"
      except: []
    core_error_no_features:
      target: "package:posgodinov_mobile/core/error/**"
      from: "package:posgodinov_mobile/features/**"
      except: []
    core_kiosk_no_features:
      target: "package:posgodinov_mobile/core/kiosk/**"
      from: "package:posgodinov_mobile/features/**"
      except: []
    core_network_no_features:
      target: "package:posgodinov_mobile/core/network/**"
      from: "package:posgodinov_mobile/features/**"
      except: []
    core_printer_no_features:
      target: "package:posgodinov_mobile/core/printer/**"
      from: "package:posgodinov_mobile/features/**"
      except: []
    core_storage_no_features:
      target: "package:posgodinov_mobile/core/storage/**"
      from: "package:posgodinov_mobile/features/**"
      except: []
    core_sync_no_features:
      target: "package:posgodinov_mobile/core/sync/**"
      from: "package:posgodinov_mobile/features/**"
      except: []
    core_utils_no_features:
      target: "package:posgodinov_mobile/core/utils/**"
      from: "package:posgodinov_mobile/features/**"
      except: []
    no_raw_palette_outside_theme:
      target: "package:posgodinov_mobile/features/**"
      from: "package:posgodinov_mobile/shared/theme/godinov_colors.dart"
      except: []
    presentation_no_data:
      target: "package:posgodinov_mobile/features/*/presentation/**"
      from: "package:posgodinov_mobile/features/*/data/**"
      except: []
