name: posgodinov_so
description: "Aplikasi Mobile Stock Opname Godinov POS untuk smartphone staf gudang & kasir."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── State Management ────────────────────────────────────────────────────────
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # ── Basis Data Lokal (Offline Engine) ───────────────────────────────────────
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # ── Penyimpanan Kredensial Aman ─────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── Jaringan & Konektivitas ─────────────────────────────────────────────────
  dio: ^5.7.0
  connectivity_plus: ^6.0.5

  # ── Hardware: Pemindai Barcode Kamera ───────────────────────────────────────
  mobile_scanner: ^5.2.3

  # ── Kriptografi & Identitas ─────────────────────────────────────────────────
  uuid: ^4.5.1
  device_info_plus: ^10.1.2
  bcrypt: ^1.1.3

  # ── Dependency Injection & Utilitas ─────────────────────────────────────────
  get_it: ^8.0.0
  intl: ^0.19.0
  collection: ^1.18.0

  # ── Animasi & Gerak Transisi Halus (Smooth Motion & Zero-Flicker) ───────────
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
