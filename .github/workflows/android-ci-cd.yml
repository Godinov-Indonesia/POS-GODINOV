name: Android CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'posgodinov-android/**'
      - '.github/workflows/android-ci-cd.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipe build APK'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      api_base_url:
        description: 'Override API_BASE_URL (kosongkan untuk pakai vars.API_BASE_URL / default)'
        required: false
        type: string

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Decode Release Keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > /tmp/godinov-release.jks

      - name: Build APK
        working-directory: posgodinov-android
        env:
          API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'https://api-pos.godinov.web.id' }}
          ANDROID_KEYSTORE_PATH: /tmp/godinov-release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug
          else
            ./gradlew assembleRelease
          fi

      - name: Clean Up Keystore
        if: always()
        run: rm -f /tmp/godinov-release.jks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: posgodinov-android-${{ inputs.build_type || 'release' }}-${{ github.run_number }}
          path: posgodinov-android/app/build/outputs/apk/${{ inputs.build_type || 'release' }}/*.apk
          if-no-files-found: error
          retention-days: 7
