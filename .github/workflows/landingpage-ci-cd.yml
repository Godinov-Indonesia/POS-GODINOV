name: Landing Page CI/CD (posgodinov-lp)

on:
  push:
    # Memicu build dev/snapshot saat ada update di folder frontend pada branch dev
    branches:
      - dev
    paths:
      - 'posgodinov-lp/**'
    # Memicu build SemVer resmi saat Anda membuat tag rilis
    tags:
      - 'posgodinov-lp-v[0-9]+.[0-9]+.[0-9]+' # Menggunakan pola regex ketat agar hanya memicu SemVer resmi
  workflow_dispatch:

jobs:
  test:
    name: 1. Run Tests & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: posgodinov-lp
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm' 
          cache-dependency-path: posgodinov-lp/pnpm-lock.yaml 

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Next.js Build Verification
        run: pnpm run build
      
  deploy-vercel:
    name: 2. Deploy to Vercel Production
    needs: test
    runs-on: ubuntu-latest
    # Hanya berjalan jika dipicu oleh pembuatan Git Tag resmi
    if: startsWith(github.ref, 'refs/tags/')
    defaults:
      run:
        working-directory: posgodinov-lp # Memastikan semua command Vercel dieksekusi di dalam folder aplikasi frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_LP_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel

      # Tarik informasi lingkungan produksi dari Vercel (akan menghasilkan folder .vercel di dalam posgodinov-fe)
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production

      # Build artifacts menggunakan CLI Vercel dari dalam sub-folder monorepo
      - name: Build Project Artifacts
        run: vercel build --prod

      # Deploy hasil kompilasi lokal langsung ke infrastruktur Vercel Production
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod
