name: Backend CI/CD

on:
  push:
    # Memicu build snapshot/dev saat ada update di folder backend pada branch dev
    branches:
      - dev
    paths:
      - 'posgodinov-be/**'
    # Memicu build SemVer resmi saat Anda membuat tag rilis di main
    tags:
      - 'posgodinov-be-v*'
  workflow_dispatch:

jobs:
  test:
    name: 1. Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: posgodinov-be
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.23'
          cache: true
          cache-dependency-path: posgodinov-be/go.sum

      - name: Download Dependencies
        run: go mod download

      - name: Run Unit & Feature Tests
        run: go test -v ./tests/unit/... ./tests/feature/...

  build-and-push:
    name: 2 & 3. Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # LANGKAH PENTING: Ekstrak tipe event dan nama versi SemVer untuk tag Docker
      - name: Docker Meta (Extract Version)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/posgodinov-backend
          tags: |
            # Jika dipicu oleh Git Tag posgodinov-be-vX.X.X -> menghasilkan tag Docker :X.X.X
            type=match,pattern=posgodinov-be-v(.*),group=1
            # Jika dipicu oleh Git Tag -> buat juga tag :latest untuk produksi
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            # Jika dipicu oleh branch dev -> menghasilkan tag :dev-sha
            type=raw,value=dev-${{ github.sha }},enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./posgodinov-be
          file: ./posgodinov-be/Dockerfile
          push: true
          # Menggunakan tag dinamis yang sudah diproses oleh docker/metadata-action
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: 4. Deploy via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    # Hanya lakukan deploy otomatis ke server jika dipicu oleh Rilis Tag Resmi
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "==> Deploying backend container..."
              cd ~/www/pos-godinov
              docker compose pull app
              docker compose up -d app
              
              echo "==> Cleaning up unused images..."
              docker image prune -f

              echo "==> Restarting Nginx..."
              cd ../.
              docker compose restart nginx

              echo "==> Backend deployment finished successfully."
