name: Frontend CI/CD (posgodinov-fe)

on:
  push:
    # Memicu build dev/snapshot saat ada update di folder frontend pada branch dev
    branches:
      - dev
    paths:
      - 'posgodinov-fe/**'
    # Memicu build SemVer resmi saat Anda membuat tag rilis di main
    tags:
      - 'posgodinov-fe-v*'
  workflow_dispatch:

jobs:
  test:
    name: 1. Run Tests & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: posgodinov-fe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: posgodinov-fe/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Next.js Build Verification
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8080' }}

  build-and-push:
    name: 2 & 3. Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # LANGKAH PENTING: Ekstrak tipe event dan nama versi SemVer untuk tag Docker Frontend
      - name: Docker Meta (Extract Version)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/posgodinov-frontend
          tags: |
            # Jika dipicu oleh Git Tag posgodinov-fe-v1.0.0 -> menghasilkan tag Docker :1.0.0
            type=match,pattern=posgodinov-fe-v(.*),group=1
            # Jika dipicu oleh Git Tag -> buat juga tag :latest untuk produksi
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            # Jika dipicu oleh branch dev -> menghasilkan tag :dev-sha
            type=raw,value=dev-${{ github.sha }},enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./posgodinov-fe
          file: ./posgodinov-fe/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8080' }}
          # Menggunakan tag dinamis yang sudah diproses oleh docker/metadata-action
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: 4. Deploy via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    # Hanya lakukan deploy otomatis ke server jika dipicu oleh Rilis Tag Resmi (SemVer)
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "==> Pulling latest frontend image..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/posgodinov-frontend:latest

            echo "==> Deploying frontend container..."
            if [ -f "/opt/posgodinov/docker-compose.yml" ]; then
              cd /opt/posgodinov
              docker compose pull frontend
              docker compose up -d frontend
            else
              docker stop posgodinov_frontend 2>/dev/null || true
              docker rm posgodinov_frontend 2>/dev/null || true
              docker run -d \
                --name posgodinov_frontend \
                --restart always \
                -p 3000:3000 \
                ${{ secrets.DOCKERHUB_USERNAME }}/posgodinov-frontend:latest
            fi

            echo "==> Cleaning up unused images..."
            docker image prune -f

            echo "==> Frontend deployment finished successfully."
