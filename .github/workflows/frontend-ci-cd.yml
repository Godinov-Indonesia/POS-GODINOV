name: Frontend Page CI/CD (posgodinov-fe)

on:
  push:
    # Memicu build dev/snapshot saat ada update di folder frontend pada branch dev
    branches:
      - dev
    paths:
      - 'posgodinov-fe/**'
    # Memicu build SemVer resmi saat Anda membuat tag rilis
    tags:
      - 'posgodinov-fe-v[0-9]+.[0-9]+.[0-9]+' # Menggunakan pola regex ketat agar hanya memicu SemVer resmi
  workflow_dispatch:

jobs:
  test:
    name: 1. Run Tests & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: posgodinov-fe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm' 
          cache-dependency-path: posgodinov-lp/pnpm-lock.yaml 

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Next.js Build Verification
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: \${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8080' }}

  build-and-push:
    name: 2 & 3. Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: \${{ secrets.DOCKERHUB_USERNAME }}
          password: \${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Meta (Extract Version)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: \${{ secrets.DOCKERHUB_USERNAME }}/posgodinov-frontend
          tags: |
            type=match,pattern=posgodinov-fe-v(.*),group=1
            type=raw,value=latest,enable=\${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=dev- github.sha ,enable={{ github.ref == 'refs/heads/dev' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./posgodinov-fe
          file: ./posgodinov-fe/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=\${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8080' }}
          tags: \${{ steps.meta.outputs.tags }}
          labels: \${{ steps.meta.outputs.labels }}
      
  # deploy-vercel:
    name: 4. Deploy to Vercel Production
    needs: test
    runs-on: ubuntu-latest
    # Hanya berjalan jika dipicu oleh pembuatan Git Tag resmi
    if: startsWith(github.ref, 'refs/tags/')
    defaults:
      run:
        working-directory: posgodinov-fe # Memastikan semua command Vercel dieksekusi di dalam folder aplikasi frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_FE_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel

      # Tarik informasi lingkungan produksi dari Vercel (akan menghasilkan folder .vercel di dalam posgodinov-fe)
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production

      # Build artifacts menggunakan CLI Vercel dari dalam sub-folder monorepo
      - name: Build Project Artifacts
        run: vercel build --prod

      # Deploy hasil kompilasi lokal langsung ke infrastruktur Vercel Production
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod
